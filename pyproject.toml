[project]
name = "loopgraph"
version = "0.1.0"
description = "Evidence-driven outcome intelligence for LoopGraph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "langgraph>=1,<2",
    "langchain>=1,<2",
    "langchain-openai",
    "openai",
    "pydantic>=2,<3",
    "python-dotenv",
    "httpx",
    "tzdata",
]

[project.optional-dependencies]
runtime = ["supabase", "apscheduler>=3,<4"]
integrations = ["composio", "composio-langchain"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", ".schema-review"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
